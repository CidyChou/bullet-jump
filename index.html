<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <link rel="icon" href="./favicon.svg?v=4.0.0" type="image/svg+xml">
  <title>Bullet Jump v4.0 · 五座高峰</title>
  <link rel="stylesheet" href="./style.css?v=4.0.0">
</head>
<body>
<main id="app" data-state="boot">
  <div id="bootSplash" class="boot-splash"><b>BJ<span>↗</span></b><small>正在校准时间…</small></div>
  <canvas id="gameCanvas" aria-label="Bullet Jump 游戏画面，自动跳跃射击，左右拖动或方向键移动" tabindex="0"></canvas>

  <div id="playUI" hidden>
  <div class="run-heading"><span id="levelLabel">01 / 初升</span><span id="runClock">0:00</span><button id="pauseButton" type="button" aria-label="暂停游戏">Ⅱ</button></div>
  <header class="game-hud">
    <div class="hud-shell">
      <section class="altitude-block"><span>ALTITUDE</span><strong id="heightValue">0m</strong></section>
      <section class="vital-block">
        <div class="vital-head"><span class="heart">♥</span><span>生命</span><strong id="hpValue">6 / 6</strong></div>
        <div class="health-track"><i id="healthFill"></i></div>
      </section>
      <section class="hud-counters">
        <div><small>击破</small><strong id="killValue">0</strong></div>
        <div><small>护盾</small><strong id="shieldValue">未解锁</strong><em id="shieldRechargeText">SKILL</em></div>
      </section>
    </div>
    <div class="run-progress">
      <div class="run-meta">
        <span>BUILD <strong id="buildLevelText">LV 0 / 3</strong></span>
        <span>NEXT <strong id="nextUpgradeText">180m</strong></span>
        <span>GOAL <strong id="stageGoalText">0 / 1400m</strong></span>
      </div>
      <div class="progress-track"><i id="rogueProgress"></i></div>
    </div>
    <div id="upgradeList" class="upgrade-list"></div>
  </header>


  <section id="bossHud" class="boss-hud" aria-hidden="true">
    <div class="boss-head"><span id="bossName">时间守门者</span><strong id="bossHpText">0 / 0</strong></div>
    <div class="boss-health-track"><i id="bossHealthFill"></i></div>
  </section>

  <section class="controls">
    <button id="bulletTimeButton" class="skill-button time ready" type="button">
      <span class="skill-symbol">◷</span><span><small>SPACE</small><b>子弹时间</b><em id="bulletTimeText">READY</em></span>
    </button>
    <button id="timeJumpButton" class="skill-button jump ready" type="button">
      <span class="skill-symbol">↑</span><span><small>↑ / W</small><b>时间跳跃</b><em id="timeJumpText">READY</em></span>
    </button>
  </section>

  <div id="joystick" class="joystick horizontal" aria-hidden="true">
    <span class="joy-arrow left">◀</span><span class="joy-arrow right">▶</span>
    <span class="joy-arrow up">▲</span><span class="joy-arrow down">▼</span>
    <span class="joy-track"></span><i id="joystickKnob"></i>
  </div>

  <aside id="tutorialHint" class="tutorial-hint" hidden aria-label="操作提示"><div><strong></strong><p></p></div><button type="button">知道了</button></aside>
  </div>
  <section id="flowRoot" class="flow-root" hidden aria-label="游戏菜单"><div id="flowScreen" class="flow-screen"></div></section>

  <section id="rogueOverlay" class="rogue-overlay" aria-hidden="true" inert>
    <div class="rogue-backdrop"></div>
    <div id="cardSelectionFlash" class="card-selection-flash"></div>
    <div class="rogue-panel">
      <div class="rogue-title">
        <small id="rogueLevelText">BUILD 1 / 3</small>
        <h2>选择一项强化</h2>
        <p>左右键切换，空格或回车确认。</p>
      </div>
      <div id="cardContainer" class="card-container"></div>
      <div class="pick-hint"><span></span> ← / → 选择　空格 / Enter 确认 <span></span></div>
    </div>
  </section>

  <div id="toast" class="toast"></div>
</main>
<script type="module" src="./src/main.js?v=4.0.0"></script>
</body>
</html>
